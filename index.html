<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мессенджер</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7b5cff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--g1:#7b5cff;--g2:#18c6d9;--bg:#f3f1fb;--card:#fff;--ink:#1b1a2e;--muted:#7c7a95;--line:#e6e3f3;--theirs:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12111f;--card:#1c1a2e;--ink:#eeedf9;--muted:#9a98b5;--line:#2c2a44;--theirs:#262440}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:linear-gradient(160deg,var(--g1),var(--g2));font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overflow:hidden}
.app{position:relative;height:100%;max-width:520px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.25)}
.hd{padding:calc(16px + env(safe-area-inset-top,0px)) 20px 20px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:0 0 28px 28px;display:flex;justify-content:space-between;align-items:center}
.hd h1{font-size:26px;font-weight:800}.hd p{font-size:13px;opacity:.85}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(8px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
#list{flex:1;overflow-y:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.item{display:flex;gap:12px;align-items:center;background:var(--card);padding:12px;border-radius:18px;margin-bottom:10px;cursor:pointer;box-shadow:0 2px 10px rgba(80,60,160,.07);transition:transform .15s;animation:pop .4s ease both;animation-delay:calc(var(--d,0)*50ms)}
.item:active{transform:scale(.97)}
.ava{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px}
.meta{flex:1;min-width:0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--muted)}
.badge{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:11px;font-size:12px;padding:1px 8px;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.ov{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.3,.9,.3,1);visibility:hidden}
.ov.on{transform:none;visibility:visible}
.chead{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2))}
.ib{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;animation:pop .3s ease both}
.m small{display:block;font-size:11px;opacity:.7;text-align:right}
.m.me{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-bottom-right-radius:5px}
.m.them{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:5px;box-shadow:0 1px 6px rgba(80,60,160,.08)}
.form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card)}
.form input,.login input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:22px;padding:12px 16px;font:inherit;min-width:0}
.form input{flex:1}.form input:focus,.login input:focus{outline:2px solid var(--g1)}
.cbtn{border:0;width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-size:18px;cursor:pointer}
.login{z-index:50;transform:none;visibility:visible;justify-content:center;padding:30px;gap:12px;background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff}
.login.off{display:none}
.login h1{font-size:34px;font-weight:800;margin-bottom:6px}
.login input{width:100%;border:0;color:#1b1a2e;background:#fff}
.btn{border:0;border-radius:22px;padding:13px;font:inherit;font-weight:700;cursor:pointer;width:100%;background:#fff;color:#4a35c9}
.link{background:none;border:0;color:#fff;font:inherit;text-decoration:underline;cursor:pointer}
#err{min-height:20px;font-size:14px;background:rgba(0,0,0,.25);border-radius:12px;padding:0 10px}
.cbtn{display:grid;place-items:center}
.plus,.cbtn svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plus svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.cbtn svg{width:22px;height:22px}
.plus{border:0;width:46px;height:46px;border-radius:50%;background:var(--bg);color:var(--g1);cursor:pointer;flex:none;display:grid;place-items:center;transition:transform .3s cubic-bezier(.4,1.5,.5,1)}
.plus.open{transform:rotate(135deg)}
.act{position:relative;flex:none;overflow:hidden}
.act svg{position:absolute;inset:0;margin:auto;transition:transform .3s cubic-bezier(.5,1.6,.5,1),opacity .2s}
.act .s{transform:scale(0) rotate(-90deg);opacity:0}
.act.has .s{transform:none;opacity:1}
.act.has .mi{transform:scale(0) rotate(90deg);opacity:0}
.menu{position:absolute;left:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:20px;padding:8px;box-shadow:0 10px 30px rgba(60,40,140,.3);display:flex;flex-direction:column;gap:4px;transform-origin:bottom left;transform:scale(.3);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.4,1.5,.5,1),opacity .2s;z-index:5}
.menu.on{transform:none;opacity:1;pointer-events:auto}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--ink);font:inherit;padding:8px 14px 8px 8px;border-radius:14px;cursor:pointer}
.menu button:active{background:var(--bg)}
.menu b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:linear-gradient(135deg,var(--g1),var(--g2))}
.rec{display:none;align-items:center;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card)}
.recording .form{display:none}
.recording .rec{display:flex;animation:pop .3s ease}
.rec .dot{width:12px;height:12px;border-radius:50%;background:#ff4d5e;animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25;transform:scale(.75)}}
.rec .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:44px}
.eq{flex:1;display:flex;align-items:center;gap:3px;height:32px;overflow:hidden}
.eq i{flex:1;max-width:5px;height:100%;border-radius:3px;background:linear-gradient(var(--g1),var(--g2));animation:eq .9s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
.m.img{padding:4px}
.m.img img{display:block;max-width:100%;max-height:320px;border-radius:14px;cursor:zoom-in;background:var(--line);min-width:120px;min-height:80px}
.m.img small{padding:2px 8px 2px}
.vm{display:flex;align-items:center;gap:10px;min-width:210px}
.vp{border:0;width:38px;height:38px;border-radius:50%;flex:none;cursor:pointer;background:rgba(255,255,255,.28);color:inherit;font-size:13px}
.m.them .vp{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:30px}
.wv i{flex:1;border-radius:2px;background:currentColor;opacity:.35;transition:opacity .2s}
.wv i.on{opacity:1}
.vm.ing .wv i{animation:bounce .8s ease-in-out infinite}
.vm.ing .wv i:nth-child(odd){animation-delay:-.4s}
@keyframes bounce{50%{transform:scaleY(.55)}}
.vd{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}
.lb{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.92);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.lb.on{opacity:1;visibility:visible}
.lb img{max-width:96%;max-height:90%;border-radius:12px;transform:scale(.85);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
.lb.on img{transform:none}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(16px);background:#25233a;color:#fff;padding:9px 16px;border-radius:16px;font-size:14px;opacity:0;transition:.3s;z-index:70;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.od{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2fd47a;margin-left:6px}
.q{font-size:13px;border-left:3px solid currentColor;padding:2px 8px;margin-bottom:4px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{display:none;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;background:var(--card);border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.rb.on{display:flex;animation:pop .25s ease}
.rb button{border:0;background:none;color:inherit;font-size:18px;cursor:pointer}
#q{margin:12px 14px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:10px 16px;font:inherit}
.tk.r{color:#7df3ff;font-weight:700}
#shm{position:static;transform:none;opacity:1;pointer-events:auto;min-width:230px}
.er{display:flex;gap:2px;justify-content:space-between}
.er button{font-size:22px!important;padding:6px 8px!important}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.rx span{background:rgba(127,127,127,.28);border-radius:10px;padding:0 7px;font-size:13px}
:root[data-theme="light"]{--bg:#f3f1fb;--card:#fff;--ink:#1b1a2e;--muted:#7c7a95;--line:#e6e3f3;--theirs:#fff}
:root[data-theme="dark"]{--bg:#12111f;--card:#1c1a2e;--ink:#eeedf9;--muted:#9a98b5;--line:#2c2a44;--theirs:#262440}
body,.app,.item,.form,.rec,.chead,.m.them,#q{transition:background-color .4s,color .4s,border-color .4s}
.tg{position:relative;width:70px;height:34px;border:0;border-radius:17px;background:rgba(255,255,255,.25);cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 9px;font-size:15px;margin-top:8px}
.tg i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.5,1.6,.5,1)}
.tg.dark i{transform:translateX(36px)}
.tg span{position:relative;z-index:1;transition:transform .5s cubic-bezier(.5,1.6,.5,1),opacity .3s}
.tg:not(.dark) .sun{transform:rotate(90deg) scale(1.15)}
.tg:not(.dark) .moon{opacity:.6}
.tg.dark .moon{transform:rotate(-25deg) scale(1.15)}
.tg.dark .sun{opacity:.6}
.pf{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;max-width:110px;transition:transform .2s}
.pf:active{transform:scale(.92)}
.pf span{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
#myava .ava{width:48px;height:48px;border:2px solid rgba(255,255,255,.75);animation:pop .5s ease}
.menu button.red{color:#ff4d5e;font-weight:700}
.menu button.red b{background:linear-gradient(135deg,#ff5f6d,#ff4d5e)}

:root{--g1:#8b5cff;--g2:#22d3ee}
:root[data-theme="dark"]{--bg:rgba(9,8,28,.55);--card:rgba(30,26,70,.6);--ink:#ecebff;--muted:#9d9bd0;--line:rgba(150,130,255,.25);--theirs:rgba(42,36,92,.85);--ov:#0b0a22}
:root[data-theme="light"]{--ov:#f3f1fb}
body{background:#05031a}
.sky{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(ellipse at 15% 8%,#2b1470 0,transparent 55%),radial-gradient(ellipse at 90% 90%,#0a3a5e 0,transparent 55%),#05031a}
.sky b{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(80px);opacity:.38;animation:drift 22s ease-in-out infinite alternate}
.n1{background:#7a38ff;left:-22vmax;top:-22vmax}
.n2{background:#0fb3d6;right:-26vmax;bottom:-26vmax;animation-delay:-9s}
@keyframes drift{to{transform:translate(9vmax,7vmax) scale(1.2)}}
.sky u{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:1;box-shadow:0 0 7px #fff}}
.sky em{position:absolute;width:130px;height:2px;background:linear-gradient(90deg,#fff,transparent);opacity:0;animation:shoot 15s linear infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(-35deg)}2%{opacity:1}9%{opacity:0;transform:translate(-460px,320px) rotate(-35deg)}100%{opacity:0}}
.app{z-index:1;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 0 90px rgba(139,92,255,.4)}
.ov{background:var(--ov)}
.hd{background:linear-gradient(135deg,#5b2cff,#9b3cff 55%,#18b9e6);box-shadow:0 8px 32px rgba(124,77,255,.5)}
.item{border:1px solid var(--line)}
.form,.rec{backdrop-filter:blur(12px)}
.m.me{box-shadow:0 0 16px rgba(124,77,255,.5)}
.ov.login{background:radial-gradient(ellipse at 50% 20%,rgba(120,70,255,.35),transparent 65%),rgba(5,3,26,.35);align-items:center;text-align:center}
.login>*{width:100%;max-width:340px;animation:rise .8s cubic-bezier(.2,.9,.3,1) both}
.login>:nth-child(2){animation-delay:.1s}.login>:nth-child(3){animation-delay:.2s}.login>:nth-child(4){animation-delay:.3s}.login>:nth-child(5){animation-delay:.4s}.login>:nth-child(6){animation-delay:.5s}.login>:nth-child(7){animation-delay:.6s}.login>:nth-child(8){animation-delay:.7s}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
.login h1{background:linear-gradient(90deg,#fff,#b9a6ff,#7be8ff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none}
.login input{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(160,140,255,.45);backdrop-filter:blur(6px);transition:box-shadow .3s,border-color .3s}
.login input::placeholder{color:rgba(255,255,255,.55)}
.login input:focus{outline:none;border-color:#7be8ff;box-shadow:0 0 18px rgba(34,211,238,.55)}
.login .btn{background:linear-gradient(135deg,#8b5cff,#22d3ee);color:#fff;animation:rise .8s .5s both,glow 2.4s 1.4s ease-in-out infinite;transition:transform .2s}
.login .btn:active{transform:scale(.96)}
@keyframes glow{0%,100%{box-shadow:0 0 14px rgba(139,92,255,.5)}50%{box-shadow:0 0 30px rgba(34,211,238,.8)}}
#nm{animation:rise .45s ease both}
.planet{position:relative;width:96px!important;height:96px;border-radius:50%;margin:0 auto 6px;background:radial-gradient(circle at 32% 30%,#c9b6ff,#7a4dff 45%,#1c0f5c 80%);box-shadow:0 0 40px rgba(139,92,255,.7),inset -12px -10px 24px rgba(0,0,0,.5);animation:rise .8s both,float 5s ease-in-out infinite!important}
.planet:after{content:"";position:absolute;left:-26px;right:-26px;top:38px;height:24px;border:3px solid rgba(123,232,255,.7);border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 12px rgba(34,211,238,.6)}
@keyframes float{50%{transform:translateY(-12px)}}
.fm{padding:6px}
.fb{display:flex;align-items:center;gap:10px;min-width:230px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.14);color:inherit;text-decoration:none;border:1px solid rgba(255,255,255,.25);transition:transform .2s}
.m.them .fb{background:rgba(124,77,255,.15);border-color:var(--line)}
.fb:active{transform:scale(.97)}
.fi{flex:none;width:44px;height:50px;border-radius:8px;background:linear-gradient(160deg,#8b5cff,#22d3ee);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 12px rgba(139,92,255,.5)}
.fn{flex:1;min-width:0;display:flex;flex-direction:column}
.fn b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fn em{font-style:normal;font-size:12px;opacity:.75}
.fd{flex:none;font-size:18px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(3px)}}

:root,:root[data-style="nebula"]{--g1:#8b5cff;--g2:#22d3ee;--n1:#7a38ff;--n2:#0fb3d6;--s1:#2b1470;--s2:#0a3a5e;--sk:#05031a;--h1:#5b2cff;--h2:#9b3cff;--h3:#18b9e6;--on:#fff;--hdon:#fff;--glow:rgba(139,92,255,.55);--rgb:150,130,255;--cc:30,26,70}
:root[data-style="space-mono"]{--g1:#f2f2f7;--g2:#7d8294;--n1:#6b6f80;--n2:#3a3d4a;--s1:#23242c;--s2:#101116;--sk:#050507;--h1:#2b2d38;--h2:#4a4d5e;--h3:#8a8fa3;--on:#0b0b12;--hdon:#fff;--glow:rgba(230,230,245,.4);--rgb:205,205,220;--cc:30,30,38}
:root[data-style="blood"]{--g1:#ff3355;--g2:#a3122f;--n1:#c4143a;--n2:#5c0a1e;--s1:#3d0a18;--s2:#1c050c;--sk:#0a0306;--h1:#7a0e27;--h2:#d6193f;--h3:#ff5a6e;--on:#fff;--hdon:#fff;--glow:rgba(255,51,85,.55);--rgb:255,90,110;--cc:52,14,24}
:root[data-style="toxic"]{--g1:#b6ff3c;--g2:#19e68c;--n1:#4fd11e;--n2:#0aa86a;--s1:#133d11;--s2:#052a1c;--sk:#030a05;--h1:#0f7a3a;--h2:#2fcf4a;--h3:#b6ff3c;--on:#07210d;--hdon:#04180a;--glow:rgba(182,255,60,.5);--rgb:150,255,90;--cc:12,44,22}
:root[data-style="mono"]{--g1:#fff;--g2:#b5b5b5;--n1:transparent;--n2:transparent;--s1:#161616;--s2:#0a0a0a;--sk:#000;--h1:#1b1b1b;--h2:#2b2b2b;--h3:#3a3a3a;--on:#000;--hdon:#fff;--glow:rgba(255,255,255,.28);--rgb:255,255,255;--cc:22,22,22}
:root[data-style="mono"] .sky u,:root[data-style="mono"] .sky em,:root[data-style="mono"] .sky b{display:none}
:root[data-theme="dark"]{--bg:rgba(var(--cc),.3);--card:rgba(var(--cc),.55);--theirs:rgba(var(--cc),.7);--line:rgba(var(--rgb),.22);--ovt:rgba(var(--cc),.28)}
:root[data-theme="light"]{--ovt:#f3f1fb}
:root{--bounce:cubic-bezier(.34,1.56,.64,1)}
body{background:var(--sk)}
.sky{background:radial-gradient(ellipse at 15% 8%,var(--s1),transparent 55%),radial-gradient(ellipse at 90% 90%,var(--s2),transparent 55%),var(--sk)}
.sky b{filter:none;width:75vmax;height:75vmax;opacity:.5;will-change:transform}
.n1{background:radial-gradient(circle,var(--n1),transparent 65%)}
.n2{background:radial-gradient(circle,var(--n2),transparent 65%)}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.sky u{will-change:opacity}
.app{backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
@media (min-width:560px){.app{box-shadow:0 0 70px var(--glow)}}
.form,.rec,.login input{backdrop-filter:none}
.ov{background:var(--ovt)}
.co>.hd,.co>#q,.co>#list{opacity:0;pointer-events:none}
.hd,#q,#list{transition:opacity .35s}
.hd,.chead{background:linear-gradient(135deg,var(--h1),var(--h2) 55%,var(--h3));color:var(--hdon)}
.hd{box-shadow:0 8px 24px -6px var(--glow)}
.ib,.tg,.gr,.pf{color:var(--hdon)}
.m.me,.cbtn,.btn,.badge,.vp,.fi,.login .btn,.m.them .vp{color:var(--on)}
.m.me,.cbtn,.btn,.badge,.login .btn,.fi{background:linear-gradient(135deg,var(--g1),var(--g2))}
.m.them .vp{background:linear-gradient(135deg,var(--g1),var(--g2))}
.m.them{border:1px solid var(--line)}
.cbtn,.btn,.badge,.ib,.plus,.m.me,.fi,.vp,.gr{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -2px 5px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.12),0 6px 16px -4px var(--glow)}
.item{box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 18px -8px rgba(0,0,0,.6)}

<body>
<div class="sky"><b class="n1"></b><b class="n2"></b></div>
<div class="app">

    <input id="em" type="email" placeholder="Почта" autocomplete="email">

  </section>
</div>

<script>
// ===== НАСТРОЙКИ ПОДКЛЮЧЕНИЯ =====
const SUPABASE_URL = "https://wextpuacyedexnqqypkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_yAUuiKkw6YuCqB-I5P1WrQ_W5u3WO8N";
// =================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AV = [["#7b5cff","#c04bff"],["#ff6a88","#ffb347"],["#18c6d9","#2f80ed"],["#1fa971","#a3e635"],["#f857a6","#ff5858"]];
const ava = (p,x="") => { const k=[...p.id].reduce((a,c)=>a+c.charCodeAt(0),0)%5; return `<div class="ava" style="background:${p.avatar_url?`url(${esc(p.avatar_url)}) center/cover`:`linear-gradient(135deg,${AV[k][0]},${AV[k][1]})`};${x}">${p.avatar_url?"":esc(p.name[0].toUpperCase())}</div>`; };
const fmt = ts => { const d=new Date(ts),n=new Date(); return d.toDateString()===n.toDateString()?d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"}); };

let me=null, myName="", peers=[], msgs={}, cur=null, maxId=0, register=false, started=false;
const getLR = id => { try{ return +localStorage.getItem("lr:"+id)||0; }catch(e){ return 0; } };
const setLR = id => { try{ localStorage.setItem("lr:"+id, Date.now()); }catch(e){} };

// ----- вход / регистрация -----
function setMode(r){
  register=r; $("nm").style.display=r?"block":"none"; $("iv").style.display=r?"block":"none"; $("go").textContent=r?"Создать аккаунт":"Войти";
  $("sw").textContent=r?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться";
  $("mode").textContent=r?"Создайте аккаунт за минуту":"Войдите, чтобы писать друзьям"; $("err").textContent="";
}
function errText(m){
  if(/Invalid login/i.test(m)) return "Неверная почта или пароль";
  if(/already registered/i.test(m)) return "Эта почта уже зарегистрирована. Нажмите «Войти»";
  if(/at least 6/i.test(m)) return "Пароль должен быть не короче 6 символов";
  if(/valid email|invalid format/i.test(m)) return "Проверьте адрес почты";
  if(/rate limit/i.test(m)) return "Слишком много попыток, подождите минуту";
  return m;
}
$("sw").onclick=()=>setMode(!register);
$("go").onclick=async()=>{
  const email=$("em").value.trim(), password=$("pw").value, name=$("nm").value.trim();
  if(!email||!password||(register&&(!name||!$("iv").value.trim()))){ $("err").textContent="Заполните все поля"; return; }
  $("go").disabled=true; $("err").textContent="";
  try{
    if(register){
      const {data:free}=await sb.rpc("name_free",{n:name}); if(free===false){ $("err").textContent="Этот ник уже занят. Выберите другой"; $("go").disabled=false; return; }
      const inv=$("iv").value.trim(); const {data:ok}=await sb.rpc("invite_ok",{c:inv}); if(ok===false){ $("err").textContent="Неверный код приглашения"; $("go").disabled=false; return; }
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,invite:inv}}});
      if(error) throw error;
      if(!data.session){ $("err").textContent="Подтвердите почту по письму, затем войдите"; setMode(false); }
      else await start(data.user);
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
      await start(data.user);
    }
  }catch(e){ $("err").textContent=errText(e.message||String(e)); }
  $("go").disabled=false;
};


// ----- запуск -----
async function start(user){
  if(started) return; started=true; me=user;
  let {data:p}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
  if(!p){ const name=(me.user_metadata&&me.user_metadata.name)||me.email.split("@")[0]; const r=await sb.from("profiles").insert({id:me.id,name}).select().single(); if(r.error){ await sb.auth.signOut(); started=false; $("err").textContent=r.error.code==="23505"?"Этот ник уже занят. Зарегистрируйтесь с другим":"Неверный код приглашения"; return; } p=r.data; }
  myName=p?p.name:"Я"; myAv=p?p.avatar_url:null; myP=p||null; myVer=!!(p&&p.verified); myBio=(p&&p.bio)||""; paintMe();
  await loadMsgs(); await loadPeers(); await loadPrefs(); await loadBlocks();
  sb.channel("m").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},x=>addMsg(x.new))
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},x=>updMsg(x.new))
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},x=>delMsg(x.old.id)).subscribe();
  startRT(); $("who").style.cursor="pointer"; $("pf").onclick=profile; loadReact();
  touchSeen(); setInterval(()=>{ if(!document.hidden) touchSeen(); },60000);
  document.addEventListener("visibilitychange",()=>{ lsT=0; touchSeen(); }); window.addEventListener("pagehide",()=>{ lsT=0; touchSeen(); });
  setInterval(()=>{ loadPeers(); pollNew(); loadReact(); },4000);
  $("login").classList.add("off"); renderList(); setTimeout(()=>$("list").classList.remove("fresh"),1200);
  const c0=new URLSearchParams(location.search).get("chat"); if(c0) openChat(c0);
  if("Notification" in window&&Notification.permission==="granted") enablePush(true);
}
async function loadPeers(){
  const {data}=await sb.from("profiles").select("*").in("id",[...new Set([...Object.keys(msgs),...extra])]);
  if(data){ const sg=JSON.stringify(data); if(sg!==window.psig){ window.psig=sg; peers=data; hdr(); if(!cur) renderList(); } }
}
async function loadMsgs(){
  const {data}=await sb.from("messages").select("*").order("id");
  (data||[]).forEach(m=>addMsg(m,true));
}
async function pollNew(){
  const {data}=await sb.from("messages").select("*").gt("id",maxId).order("id");
  (data||[]).forEach(m=>addMsg(m));
}
function addMsg(m,quiet){
  const peer=m.sender===me.id?m.receiver:m.sender;
  const arr=msgs[peer]=msgs[peer]||[];
  if(arr.some(x=>x.id===m.id)) return;
  arr.push(m); arr.sort((a,b)=>a.id-b.id); if(m.id>maxId) maxId=m.id;
  if(!quiet&&!peers.some(p=>p.id===peer)) setTimeout(loadPeers,0);
  if(m.sender!==me.id&&!quiet&&(cur!==peer||document.hidden)) beep();
  if(!quiet&&prefs[peer]&&(prefs[peer].hidden||(m.sender!==me.id&&prefs[peer].archived))) setPref(peer,{hidden:false,...(m.sender!==me.id?{archived:false}:{})});
  if(cur===peer){ setLR(peer); renderMsgs(); if(m.sender!==me.id&&!document.hidden) markRead(peer); }
  if(!quiet) renderList();
}

// ----- список -----
function renderList(){
  const unread=p=>(msgs[p.id]||[]).filter(m=>m.sender===p.id&&!m.read).length;
  const tot=peers.reduce((n,p)=>n+unread(p),0); document.title=tot?"("+tot+") Мессенджер":"Мессенджер";
  const flt=($("q").value||"").toLowerCase();
  const last=p=>{ const a=vis(p.id); return a[a.length-1]; };
  const isA=p=>!!(prefs[p.id]&&prefs[p.id].archived), isP=p=>!!(prefs[p.id]&&prefs[p.id].pinned), nArch=peers.filter(p=>isA(p)&&!(prefs[p.id]&&prefs[p.id].hidden)).length;
  const sorted=peers.filter(p=>p.name.toLowerCase().includes(flt)&&isA(p)===showArch&&((msgs[p.id]&&msgs[p.id].length)||isP(p))&&!(prefs[p.id]&&prefs[p.id].hidden)).sort((a,b)=>{ const x=last(a),y=last(b); return (isP(b)-isP(a))||(y?y.id:0)-(x?x.id:0)||a.name.localeCompare(b.name); });
  $("list").innerHTML=archRow(nArch)+(sorted.length?sorted.map((p,i)=>{ const l=last(p),u=unread(p);
    return `<div class="item" style="--d:${i}" data-id="${p.id}">${ava(p)}<div class="meta"><div class="row"><span class="name">${pin(p)}${esc(p.name)}${vb(p)}${online.has(p.id)?'<span class="od"></span>':""}</span><span class="time">${l?fmt(l.created_at):""}</span></div><div class="row"><span class="sub">${l?(l.sender===me.id?"Вы: ":"")+prev(l):"Напишите первым"}</span>${u?`<span class="badge">${u}</span>`:""}</div></div></div>`; }).join("")
    :`<div class="empty">Чатов пока нет.<br>Введите ник в поле поиска выше, чтобы найти человека и начать чат.</div>`)+foundHtml(sorted);
}
$("list").onclick=e=>{ const el=e.target.closest(".item"); if(!el) return; if(el.dataset.arch!==undefined){ goArch(el.dataset.arch==="1"); return; } const f=found.find(x=>x.id===el.dataset.id); if(f&&!peers.some(x=>x.id===f.id)){ peers.push(f); extra.add(f.id); } if(f){ $("q").value=""; found=[]; } openChat(el.dataset.id); };

// ----- чат -----
function openChat(id){
  const p=peers.find(x=>x.id===id); if(!p) return; cur=id; setLR(id);
  $("chat").innerHTML=`<div class="chead"><button class="ib" id="back" aria-label="Назад">←</button>${ava(p,"width:40px;height:40px;font-size:16px")}<div><strong>${esc(p.name)}</strong>${vb(p)}<div id="st" style="font-size:12px;opacity:.85"></div></div><span style="flex:1"></span><button class="ib" id="cm" aria-label="Меню чата">⋮</button></div><div class="sb" id="sb"><input id="si" placeholder="Поиск по сообщениям" autocomplete="off"><span id="sc"></span><button class="ib sq" id="su" aria-label="Выше">▲</button><button class="ib sq" id="sd" aria-label="Ниже">▼</button><button class="ib sq" id="sx" aria-label="Закрыть">✕</button></div><div class="pm" id="pm"></div><div class="msgs" id="msgs"></div><div class="rb" id="rb"></div><div class="form"><button class="plus" id="plus" aria-label="Прикрепить"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input id="inp" placeholder="Сообщение" autocomplete="off"><button class="plus" id="em" aria-label="Смайлики">😊</button><button class="cbtn act" id="act" aria-label="Записать или отправить"><svg class="mi" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><svg class="s" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg></button></div>
  <div class="rec"><button class="cbtn" id="rx" style="background:var(--bg);color:#ff4d5e" aria-label="Отмена"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button><span class="dot"></span><span class="t" id="rt">0:00</span><div class="eq">${Array.from({length:26},(_,i)=>`<i style="animation-delay:-${(i*0.07).toFixed(2)}s"></i>`).join("")}</div><button class="cbtn" id="rs" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2-6z"/></svg></button></div>
  <div class="menu" id="menu"><button id="m1"><b>🖼</b>Фото из галереи</button><button id="m2"><b>📷</b>Снять фото</button><button id="m3"><b>🎬</b>Видео</button><button id="m4"><b>📎</b>Файл</button></div>
  <div class="ep" id="ep">${EM.map(e=>`<button>${e}</button>`).join("")}</div><input type="file" accept="image/*" id="f1" hidden><input type="file" accept="image/*" capture="environment" id="f2" hidden><input type="file" accept="video/*" id="f4" hidden><input type="file" id="f5" hidden>`;
  $("chat").classList.add("on"); document.querySelector(".app").classList.add("co"); sq=""; renderMsgs(); hdr(); showRb(); markRead(id);
  $("back").onclick=()=>{ stopRec(true); closeMenu(); if(au){ au.pause(); au=null; auId=null; } cur=null; $("chat").classList.remove("on"); document.querySelector(".app").classList.remove("co"); renderList(); };
  $("inp").onkeydown=e=>{ if(e.key==="Enter") send(); };
  $("inp").oninput=()=>{ $("act").classList.toggle("has",!!$("inp").value.trim()); if(ch&&Date.now()-lastT>1500){ lastT=Date.now(); ch.send({type:"broadcast",event:"typing",payload:{from:me.id,to:cur}}); } };
  $("act").onclick=()=>{ closeMenu(); $("inp").value.trim()?send():startRec(); };
  $("rs").onclick=()=>stopRec(false); $("rx").onclick=()=>stopRec(true);
  $("cm").onclick=chatMenu; $("chat").querySelector(".chead").onclick=e=>{ if(!e.target.closest("button")) peerCard(id); };
  $("em").onclick=()=>{ const o=$("ep").classList.contains("on"); closeMenu(); if(!o) $("ep").classList.add("on"); };
  $("ep").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; const i=$("inp"); i.value+=b.textContent; i.dispatchEvent(new Event("input")); }; $("si").oninput=doSearch; $("su").onclick=()=>stepMark(-1); $("sd").onclick=()=>stepMark(1); $("sx").onclick=closeSearch;

  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){ if(!quiet) toast("Здесь уведомления недоступны. На iPhone добавьте сайт на экран «Домой» и откройте его оттуда"); return; }
  try{
    const perm=quiet?Notification.permission:await Notification.requestPermission();
    if(perm!=="granted"){ if(!quiet) toast("Разрешение не выдано. Включите уведомления в настройках браузера"); return; }
    const reg=await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    const j=sub.toJSON();
    const {error}=await sb.from("push_subscriptions").upsert({user_id:me.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth});
    if(error) throw error;
    if(!quiet) toast("Уведомления включены ✓");
  }catch(e){ if(!quiet) toast("Ошибка: "+(e.message||e)); }
}
if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.open&&me) openChat(e.data.open); });

  for(let i=0;i<45;i++){ const e=document.createElement("u"), z=Math.random()*2+1; e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:-${Math.random()*6}s;animation-duration:${3+Math.random()*4}s`; sk.appendChild(e); }

function paintMe(){ $("who").innerHTML=esc(myName)+vb({verified:myVer}); $("myava").innerHTML=ava({id:me.id,name:myName||"?",avatar_url:myAv}); }
function confirmOut(){
  const s=$("shm");
  s.innerHTML=`<div style="padding:10px 14px;max-width:240px;font-weight:600">Вы точно хотите выйти из аккаунта?</div><button data-x="y" class="red"><b>⎋</b>Да, выйти</button><button data-x="c"><b>✕</b>Отмена</button>`;
  s.onclick=async e=>{ const k=e.target.closest("button"); if(k&&k.dataset.x==="y"){ e.stopPropagation(); try{ const r=await navigator.serviceWorker.getRegistration(), sub=r&&await r.pushManager.getSubscription(); if(sub) await sb.from("push_subscriptions").delete().eq("endpoint",sub.endpoint); }catch(_){} await sb.auth.signOut(); location.reload(); } };
}
function setTheme(d,save){ document.documentElement.dataset.theme=d?"dark":"light"; $("tg").classList.toggle("dark",d); if(save){ try{ localStorage.setItem("theme",d?"dark":"light"); }catch(e){} } }
{ let th=null; try{ th=localStorage.getItem("theme"); }catch(e){} setTheme(th?th==="dark":true); }
$("tg").onclick=()=>setTheme(document.documentElement.dataset.theme!=="dark",true);
let rmap={}, rsig="";
async function loadReact(){
  const {data}=await sb.from("reactions").select("*"); if(!data) return;
  const sig=JSON.stringify(data); if(sig===rsig) return; rsig=sig; rmap={};
  data.forEach(r=>{ (rmap[r.message_id]=rmap[r.message_id]||[]).push(r); }); if(cur) renderMsgs();
}
async function toggleReact(id,em){
  const mine=(rmap[id]||[]).find(r=>r.user_id===me.id);
  if(mine) await sb.from("reactions").delete().eq("message_id",id).eq("user_id",me.id);
  if(!mine||mine.emoji!==em) await sb.from("reactions").insert({message_id:id,emoji:em});
  rsig=""; await loadReact();
  if(!mine||mine.emoji!==em){ const chip=document.querySelector(`#msgs [data-mid="${id}"] .rx [data-e="${em}"]`); if(chip) chip.classList.add("rpop"); burstAt(em,chip); }
}
function fwd(m){
  const s=$("shm");
  s.innerHTML=peers.map(p=>`<button data-p="${p.id}"><b>➤</b>${esc(p.name)}</button>`).join("")||"<button>Некому пересылать</button>";
  s.onclick=async e=>{ const b=e.target.closest("button"); if(!b||!b.dataset.p) return; replyTo=null; showRb();
    try{ await sendRow(b.dataset.p,{kind:m.kind||"text",text:m.text,url:m.url||null}); toast("Переслано"); }catch(_){ toast("Не удалось переслать"); } };
}
async function sendFile(f,kind){
  if(!f||!cur) return; if(f.size>45e6){ toast("Файл больше 45 МБ"); return; } const to=cur; toast("Отправка…");
  try{ const ext=(f.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").slice(0,6)||"bin";
    const url=await upload(f,ext,f.type||"application/octet-stream"); await sendRow(to,{kind,text:f.name,url}); $("toast").classList.remove("on"); }
  catch(e){ toast("Не удалось отправить: "+(e.message||e)); }
}
function profile(){
  const s=$("shm"), mp={...(myP||{}),id:me.id,name:myName,avatar_url:myAv,bio:myBio,verified:myVer,created_at:(myP&&myP.created_at)||new Date()};
  s.innerHTML=pcard(mp)+`<button data-x="a"><b>🖼</b>Сменить фото</button><button data-x="n"><b>✏️</b>Сменить имя</button><button data-x="b"><b>💬</b>О себе</button><button data-x="t"><b>😎</b>Статус</button><button data-x="g"><b>🎨</b>Фон профиля</button><button data-x="o" class="red"><b>⎋</b>Выйти из аккаунта</button>`;
  s.onclick=e=>{ const k=e.target.closest("button"); if(!k) return; const x=k.dataset.x;
    if(x==="o"){ e.stopPropagation(); confirmOut(); } else if(x==="g"){ e.stopPropagation(); bgMenu(); }
    else if(x==="n") rename(); else if(x==="b") editBio(); else if(x==="t") editStatus(); else if(x==="a") pickAvatar(); };

async function rename(){ const n=(prompt("Ваше имя:",myName)||"").trim(); if(!n) return; const {error}=await sb.from("profiles").update({name:n}).eq("id",me.id); if(!error){ myName=n; paintMe(); } else toast(error.code==="23505"?"Этот ник уже занят":"Не удалось сменить имя"); }
const dur=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const prev=m=>m.kind==="video"?"🎬 Видео":m.kind==="file"?"📎 "+esc(m.text):m.kind==="image"?"📷 Фото":m.kind==="voice"?"🎤 Голосовое":esc(m.text);
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),3000); }
function closeMenu(){ const ep=$("ep"); if(ep) ep.classList.remove("on"); const m=$("menu"); if(m) m.classList.remove("on"); const p=$("plus"); if(p) p.classList.remove("open"); }
$("lb").onclick=()=>$("lb").classList.remove("on");

function bubble(m){
  let h=bubble0(m);
  h=h.replace("<small>",`<small>${m.edited?"изменено · ":""}`);
  if(m.sender===me.id) h=h.replace("</small>",` <span class="tk ${m.read?"r":""}">${m.read?"✓✓":"✓"}</span></small>`);
  const o=m.reply_to&&findMsg(m.reply_to);
  if(o) h=h.replace(/(<div class="m [^"]*">)/,`$1<div class="q">${prev(o)}</div>`);
  const rs=rmap[m.id];
  if(rs&&rs.length){ const c={}; rs.forEach(r=>c[r.emoji]=(c[r.emoji]||0)+1); h=h.replace(/<\/div>$/,`<div class="rx">${Object.entries(c).map(([e,n])=>`<span data-e="${e}">${e}${n>1?" "+n:""}</span>`).join("")}</div></div>`); }
  return h.replace('<div class="m ',`<div data-mid="${m.id}" class="m `);
}
function bubble0(m){
  const c=m.sender===me.id?"me":"them", t=`<small>${fmt(m.created_at)}</small>`;
  if(m.kind==="image") return `<div class="m img ${c}"><img src="${esc(m.url)}" data-full="${esc(m.url)}" alt="Фото" onload="var b=document.getElementById('msgs');b.scrollTop=b.scrollHeight">${t}</div>`;
  if(m.kind==="video") return `<div class="m img ${c}"><video src="${esc(m.url)}" controls playsinline preload="metadata" style="display:block;max-width:100%;max-height:320px;border-radius:14px;min-width:200px"></video>${t}</div>`;
  if(m.kind==="file"){ const n=m.text||"файл", ext=n.includes(".")?n.split(".").pop().slice(0,4).toUpperCase():"FILE";
    return `<div class="m fm ${c}"><a class="fb" href="${esc(m.url)}" target="_blank" rel="noopener" download="${esc(n)}"><span class="fi">${esc(ext)}</span><span class="fn"><b>${esc(n)}</b><em>Нажмите, чтобы скачать</em></span><span class="fd">⬇</span></a>${t}</div>`; }
  if(m.kind==="voice"){ const d=+m.text||1, w=Array.from({length:22},(_,i)=>`<i style="height:${30+((m.id*7+i*13)%70)}%"></i>`).join("");
    return `<div class="m ${c}"><div class="vm" data-id="${m.id}" data-url="${esc(m.url)}" data-d="${d}"><button class="vp" aria-label="Воспроизвести">▶</button><div class="wv">${w}</div><button class="sp" aria-label="Скорость">${vSp}×</button><span class="vd">${dur(d)}</span></div>${t}</div>`; }
  return `<div class="m ${c}">${hl(m.text)}${t}</div>`;
}

// ----- голосовые: воспроизведение -----
let au=null, auId=null;
function playVoice(box){
  const id=box.dataset.id;
  if(au&&auId===id){ if(au.paused) au.play(); else au.pause(); return; }
  if(au) au.pause();
  au=new Audio(box.dataset.url); auId=id; au.playbackRate=vSp;
  au.onplay=mark; au.onpause=mark; au.ontimeupdate=prog;
  au.onended=()=>{ au=null; auId=null; mark(); };
  au.play().catch(()=>toast("Не удалось воспроизвести"));
}
function mark(){
  document.querySelectorAll(".vm").forEach(b=>{
    const isCur=au&&auId===b.dataset.id, play=isCur&&!au.paused;
    b.classList.toggle("ing",!!play); b.querySelector(".vp").textContent=play?"❚❚":"▶";
    if(!isCur) b.querySelectorAll("i").forEach(i=>i.classList.remove("on"));
  });
  prog();
}
function prog(){
  if(!au) return; const b=document.querySelector(`.vm[data-id="${auId}"]`); if(!b) return;
  const d=isFinite(au.duration)&&au.duration>0?au.duration:+b.dataset.d, is=b.querySelectorAll(".wv i"), n=Math.round(au.currentTime/d*is.length);
  is.forEach((x,k)=>x.classList.toggle("on",k<n));
}

// ----- отправка -----
async function sendRow(to,row){
  if(replyTo){ row.reply_to=replyTo.id; replyTo=null; showRb(); }
  const {data,error}=await sb.from("messages").insert({receiver:to,...row}).select().single();
  if(error) throw error; addMsg(data);
}
async function upload(blob,ext,type){
  const path=`${me.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await sb.storage.from("media").upload(path,blob,{contentType:type});
  if(error) throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}
async function send(){
  const inp=$("inp"), text=inp.value.trim(); if(!text||!cur) return; if(blk.has(cur)){ toast("Вы заблокировали этого пользователя"); return; }
  inp.value=""; $("act").classList.remove("has"); inp.focus();
  try{ await sendRow(cur,{text}); }
  catch(e){ inp.value=text; $("act").classList.add("has"); alert(/row-level/i.test(e.message)?"Вы не можете писать этому пользователю":"Не удалось отправить: "+e.message); }
}
function shrink(file,mx=1280){ return new Promise((res,rej)=>{
  const img=new Image(), u=URL.createObjectURL(file);
  img.onload=()=>{ const k=Math.min(1,mx/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
    c.toBlob(b=>b?res(b):rej(new Error("Не удалось обработать фото")),"image/jpeg",.82); };
  img.onerror=()=>rej(new Error("Это не изображение")); img.src=u; }); }
async function sendImage(file){
  if(!file||!cur) return; const to=cur; toast("Отправка фото…");
  try{ const url=await upload(await shrink(file),"jpg","image/jpeg"); await sendRow(to,{kind:"image",text:"",url}); $("toast").classList.remove("on"); }
  catch(e){ toast("Не удалось отправить: "+(e.message||e)); }
}

// ----- запись голоса -----
let rec=null, chunks=[], rtm=null, rst=0, recTo=null;
async function startRec(){
  if(!navigator.mediaDevices||!window.MediaRecorder){ toast("Запись не поддерживается в этом браузере"); return; }
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(t=>MediaRecorder.isTypeSupported(t))||"";
    rec=new MediaRecorder(st,mt?{mimeType:mt}:{}); chunks=[]; recTo=cur;
    rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
    rec.start(); rst=Date.now(); $("rt").textContent="0:00"; $("chat").classList.add("recording");
    rtm=setInterval(()=>{ $("rt").textContent=dur(Math.floor((Date.now()-rst)/1000)); },250);
  }catch(e){ toast("Разрешите доступ к микрофону в настройках браузера"); }
}
function stopRec(cancel){
  if(!rec) return; clearInterval(rtm); const r=rec, to=recTo, sec=Math.max(1,Math.round((Date.now()-rst)/1000)); rec=null;
  $("chat").classList.remove("recording");
  r.onstop=async()=>{
    r.stream.getTracks().forEach(t=>t.stop()); if(cancel) return;
    const type=(r.mimeType||"audio/webm").split(";")[0], blob=new Blob(chunks,{type}); if(blob.size<500) return;
    try{ toast("Отправка…"); const url=await upload(blob,type.includes("mp4")?"m4a":"webm",type); await sendRow(to,{kind:"voice",text:String(sec),url}); $("toast").classList.remove("on"); }
    catch(e){ toast("Не удалось отправить: "+(e.message||e)); }
  };
  if(r.state!=="inactive") r.stop(); else r.onstop();
}

// ----- старт страницы -----
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) await start(session.user);
})();
